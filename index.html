<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAKAD - UMPR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100dvh; /* Menggunakan dynamic viewport height agar pas dengan address bar HP */
      overflow: hidden;
      background-color: #f4f6f9;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%; /* Hapus + 30px agar pas dengan tinggi layar */
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="https://script.google.com/macros/s/AKfycbzH2djHPmeUcY03dFcfdki2i_NILy24y-f_ZlhHba0oOpIthXRQYMwvfMs9N6ihURWt/exec"
    allow="geolocation *; camera *">
  </iframe>
</body>
</html>
